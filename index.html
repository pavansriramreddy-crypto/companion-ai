<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Companion AI</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <div class="app">

        <!-- =========================
             SIDEBAR
        ========================== -->

        <aside class="sidebar">

            <div class="logo">
                <div class="logo-icon">✦</div>
                <span>Companion AI</span>
            </div>


            <button
                id="newChat"
                class="new-chat"
            >
                ＋ New Chat
            </button>


            <!-- CONVERSATION -->

            <div class="section-title">
                CONVERSATION
            </div>

            <button
                class="category active"
                data-category="chat"
            >
                💬
                <span>Chat</span>
            </button>

            <button
                class="category"
                data-category="tutor"
            >
                🎓
                <span>Tutor</span>
            </button>


            <!-- LEARNING -->

            <div class="section-title">
                LEARNING
            </div>

            <button
                class="category"
                data-category="study"
            >
                📚
                <span>Study</span>
            </button>

            <button
                class="category"
                data-category="science"
            >
                🔬
                <span>Science</span>
            </button>

            <button
                class="category"
                data-category="mathematics"
            >
                ➗
                <span>Mathematics</span>
            </button>


            <!-- SKILLS -->

            <div class="section-title">
                SKILLS
            </div>

            <button
                class="category"
                data-category="coding"
            >
                💻
                <span>Coding</span>
            </button>

            <button
                class="category"
                data-category="ideas"
            >
                💡
                <span>Ideas</span>
            </button>

            <button
                class="category"
                data-category="career"
            >
                💼
                <span>Career</span>
            </button>


            <!-- GENERAL -->

            <div class="section-title">
                GENERAL
            </div>

            <button
                class="category"
                data-category="general"
            >
                🌎
                <span>General</span>
            </button>


            <div class="sidebar-bottom">

                <div class="status">

                    <span class="status-dot"></span>

                    AI system ready

                </div>

            </div>

        </aside>


        <!-- =========================
             MAIN CHAT
        ========================== -->

        <main class="chat-container">


            <!-- HEADER -->

            <header class="header">

                <div class="current-category">

                    <div
                        id="categoryIcon"
                        class="category-icon"
                    >
                        💬
                    </div>


                    <div>

                        <div
                            id="categoryName"
                            class="category-name"
                        >
                            Chat
                        </div>


                        <div
                            id="categoryDescription"
                            class="category-description"
                        >
                            General conversation
                        </div>

                    </div>

                </div>


                <div class="header-buttons">

                    <button
                        class="header-button"
                        title="Settings"
                    >
                        ⚙
                    </button>

                    <button
                        class="header-button"
                        title="More"
                    >
                        ⋮
                    </button>

                </div>

            </header>


            <!-- =========================
                 CHAT MESSAGES
            ========================== -->

            <section
                id="messages"
                class="messages"
            >

                <div
                    id="welcome"
                    class="welcome"
                >

                    <div
                        id="welcomeIcon"
                        class="welcome-icon"
                    >
                        ✦
                    </div>


                    <h1 id="welcomeTitle">
                        What's on your mind?
                    </h1>


                    <p id="welcomeText">

                        Talk about anything.

                        Choose a category from
                        the sidebar when you want
                        specialized help.

                    </p>

                </div>

            </section>


            <!-- =========================
                 MESSAGE INPUT
            ========================== -->

            <div class="input-area">

                <div class="input-box">

                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="Start a conversation..."
                    ></textarea>


                    <button
                        id="sendButton"
                        class="send-button"
                        title="Send"
                    >
                        ➤
                    </button>

                </div>


                <div class="input-note">

                    Companion AI

                </div>

            </div>

        </main>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="js/app.js"></script>

</body>

</html>
